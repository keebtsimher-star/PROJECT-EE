<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Keebtsim Her | Electrical Engineering</title>

  <style>

    /* =========================
       BASIC PAGE SETUP
       ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      background-color: #080c0b;

      background-image:
        linear-gradient(rgba(86, 245, 155, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(86, 245, 155, 0.035) 1px, transparent 1px);

      background-size: 40px 40px;

      color: #e8eee9;

      font-family:
        "Courier New",
        Courier,
        monospace;
    }


    /* =========================
       NAVIGATION
       ========================= */

    nav {
      width: 100%;
      min-height: 78px;

      padding: 20px 6%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-bottom: 1px solid #1d3027;

      background: rgba(8, 12, 11, 0.85);
    }

    .logo {
      color: #56f59b;

      font-size: 17px;
      font-weight: bold;

      letter-spacing: 2px;
    }

    .logo span {
      color: #65766d;
    }

    .nav-links {
      display: flex;

      gap: 30px;

      list-style: none;
    }

    .nav-links a {
      color: #89968e;

      text-decoration: none;

      font-size: 12px;

      letter-spacing: 1px;

      transition: 0.2s;
    }

    .nav-links a:hover {
      color: #56f59b;
    }


    /* =========================
       MAIN HERO
       ========================= */

    .hero {
      width: 100%;
      min-height: calc(100vh - 78px);

      padding: 70px 8%;

      display: grid;

      grid-template-columns:
        minmax(0, 1.15fr)
        minmax(350px, 0.85fr);

      align-items: center;

      gap: 70px;
    }


    /* =========================
       HERO TEXT
       ========================= */

    .section-label {
      margin-bottom: 25px;

      color: #56f59b;

      font-size: 12px;

      letter-spacing: 2px;
    }

    .hero h1 {
      margin-bottom: 26px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: clamp(55px, 7vw, 105px);

      line-height: 0.88;

      letter-spacing: -5px;
    }

    .hero h1 span {
      color: #56f59b;
    }

    .degree {
      color: #a9b5ae;

      font-size: 16px;

      line-height: 1.8;
    }

    .degree strong {
      color: #ffffff;
    }

    .description {
      max-width: 600px;

      margin-top: 32px;

      color: #718078;

      line-height: 1.9;

      font-size: 14px;
    }


    /* =========================
       BUTTONS
       ========================= */

    .buttons {
      margin-top: 35px;

      display: flex;

      flex-wrap: wrap;

      gap: 12px;
    }

    .button {
      display: inline-block;

      padding: 12px 18px;

      border: 1px solid #315d47;

      color: #56f59b;

      text-decoration: none;

      font-size: 12px;

      letter-spacing: 1px;

      transition: 0.2s;
    }

    .button:hover {
      background: #56f59b;

      color: #07100b;
    }


    /* =========================
       CIRCUIT GRAPHIC
       ========================= */

    .circuit-area {
      position: relative;

      width: 100%;
      height: 500px;

      display: flex;

      justify-content: center;
      align-items: center;
    }
